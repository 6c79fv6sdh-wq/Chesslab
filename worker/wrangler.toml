# Конфигурация Cloudflare Worker'а «gate» — единственная задача: проверить
# код доступа и выдать подписанный токен. Сам код и приватный ключ подписи
# сюда НЕ попадают — это секреты (wrangler secret put), а не переменные.
#
# Первоначальная настройка — см. раздел «Доступ» в README корня репозитория.

name = "sciencechess-lab-gate"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Разрешённые источники запросов (CORS), через запятую, без пробелов и
# без слэша на конце. Оба текущих адреса Lab — под одним и тем же origin
# (GitHub Pages одного владельца отдаёт разные репозитории по разным путям
# одного домена, а origin — это схема+хост, путь не в счёт), поэтому
# значения по умолчанию хватает на оба сразу:
#   https://6c79fv6sdh-wq.github.io/Speed-lab/
#   https://6c79fv6sdh-wq.github.io/vladchess-site/lab/
# Появится свой домен — добавь его через запятую и перезадеплой
# (wrangler deploy, без пересборки фронтенда).
[vars]
ALLOWED_ORIGINS = "https://6c79fv6sdh-wq.github.io"
# Срок жизни токена доступа, секунды. 2592000 = 30 дней: достаточно долго,
# чтобы не дёргать учеников повторным вводом кода на каждом заходе (как
# было раньше — доступ не истекал вовсе), и достаточно коротко, чтобы
# утечка токена не работала вечно. Поменять — значение здесь и
# wrangler deploy, без пересборки фронтенда.
TOKEN_TTL_SECONDS = "2592000"

# KV для счётчика неудачных попыток (rate limiting). Namespace создаётся
# один раз: npx wrangler kv namespace create RATE_LIMIT_KV — команда
# выведет настоящий id, впиши его вместо REPLACE_WITH_KV_NAMESPACE_ID.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
