<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>diag2</title>
<style>
  body { font: 15px/1.45 -apple-system, sans-serif; padding: 14px; background:#111; color:#eee; }
  .row { background:#1d1d1d; padding:10px 12px; border-radius:8px; margin:8px 0; }
  .t { font-weight:600; font-size:13px; opacity:.75; margin-bottom:4px; }
  .v { font-family: ui-monospace, monospace; font-size:13px; word-break:break-all; white-space:pre-wrap; }
  .ok { color:#5ad07a; } .bad { color:#ff8a7a; }
</style>
</head>
<body>
<h2>Проверка входа — 6 вариантов</h2>
<div id="out"></div>

<script>
const out = document.getElementById('out');
function add(title, value, ok) {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<div class="t"></div><div class="v"></div>';
  d.querySelector('.t').textContent = title;
  const v = d.querySelector('.v');
  v.textContent = value;
  if (ok === true) v.classList.add('ok');
  if (ok === false) v.classList.add('bad');
  out.append(d);
  return v;
}

const URL_BASE = 'https://chesslab.6c79fv6sdh.workers.dev';

add('Service Worker управляет страницей?',
    navigator.serviceWorker && navigator.serviceWorker.controller ? 'ДА (controller есть)' : 'нет');

async function probe(title, fn) {
  const cell = add(title, 'выполняю…');
  try {
    const r = await fn();
    cell.textContent = r;
    cell.classList.add('ok');
  } catch (e) {
    cell.textContent = (e && e.name ? e.name + ': ' + e.message : String(e));
    cell.classList.add('bad');
  }
}

(async () => {
  // A — как сейчас делает приложение (Content-Type => нужен preflight)
  await probe('A. POST + Content-Type: application/json', async () => {
    const r = await fetch(URL_BASE + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: 'diag-a' }),
    });
    return 'HTTP ' + r.status + ' — ' + (await r.text());
  });

  // B — простой запрос: без своих заголовков, preflight НЕ нужен
  await probe('B. POST без заголовков (без preflight)', async () => {
    const r = await fetch(URL_BASE + '/login', {
      method: 'POST',
      body: JSON.stringify({ code: 'diag-b' }),
    });
    return 'HTTP ' + r.status + ' — ' + (await r.text());
  });

  // C — сам preflight отдельно
  await probe('C. OPTIONS (preflight) вручную', async () => {
    const r = await fetch(URL_BASE + '/login', { method: 'OPTIONS' });
    return 'HTTP ' + r.status;
  });

  // D — GET на корень (заведомо рабочий на этом телефоне)
  await probe('D. GET / (контроль)', async () => {
    const r = await fetch(URL_BASE + '/');
    return 'HTTP ' + r.status + ' — ' + (await r.text());
  });

  // E — тот же POST, но через XMLHttpRequest
  await probe('E. POST через XMLHttpRequest', () => new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', URL_BASE + '/login');
    x.setRequestHeader('Content-Type', 'application/json');
    x.onload = () => res('HTTP ' + x.status + ' — ' + x.responseText);
    x.onerror = () => rej(new Error('XHR onerror (сетевая ошибка)'));
    x.send(JSON.stringify({ code: 'diag-e' }));
  }));

  // F — POST с явным no-cors (просто проверить, доходит ли вообще)
  await probe('F. POST mode:no-cors (доходит ли запрос)', async () => {
    const r = await fetch(URL_BASE + '/login', {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ code: 'diag-f' }),
    });
    return 'запрос ушёл, type=' + r.type + ' status=' + r.status;
  });

  add('Готово', 'Пришли скриншот этой страницы целиком.');
})();
</script>
</body>
</html>
