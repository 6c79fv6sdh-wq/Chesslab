<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Масштабирование пальцами разрешено намеренно: maximum-scale=1 и
         user-scalable=no запрещали зум даже там, где он реально нужен
         (мелкий текст, доска на маленьком экране) — доступность важнее
         косметической невозможности случайно отмасштабировать интерфейс. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161512" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chess Lab" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>ScienceChess Lab</title>
  </head>
  <body>
    <div id="app">
      <header id="brand">
        <span class="brand-name">ScienceChess <span class="brand-accent">Lab</span></span>
        <span class="brand-by">by Vladislav Dmitrovsky</span>
      </header>
      <nav id="tabs" aria-label="Основная навигация">
        <div class="tabs-row tabs-row--primary" id="tabs-primary"></div>
        <div class="tabs-row tabs-row--secondary" id="tabs-secondary" aria-label="Тренировки"></div>
      </nav>
      <main id="view"></main>
      <footer id="credit">
        <span class="credit-name">ScienceChess Lab</span>
        <span class="credit-sep" aria-hidden="true">·</span>
        <span class="credit-by">by Vladislav Dmitrovsky</span>
        <span class="credit-sep" aria-hidden="true">·</span>
        <span class="credit-build" id="build-id"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
