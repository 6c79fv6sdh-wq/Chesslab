name: Предпросмотр ветки в GitHub Pages

# Публикация текущей ветки разработки на GitHub Pages, чтобы страницу
# можно было открыть на настоящем устройстве (iPad/Safari) — без этого
# не проверить изоляцию страницы и человекоподобных ботов на Maia.
#
# Почему деплой из Actions, а не раздача ветки gh-pages. Чтобы включить
# раздачу ветки, нужен вызов POST /repos/{owner}/{repo}/pages. Из среды
# ассистента его режет прокси, а из workflow он отвечает 403: встроенный
# GITHUB_TOKEN получает pages: write, но создание сайта требует прав
# администратора репозитория, которые ему не выдаются. Деплой же из
# Actions — штатный путь и работает обычным токеном, если режим Pages
# уже выставлен на «GitHub Actions».

on:
  push:
    branches: ['claude/**']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build

      # Включение — best-effort: у встроенного токена может не быть прав,
      # и это не повод валить сборку. Если Pages уже включены в режиме
      # «GitHub Actions», шаг просто подтвердит настройки.
      - name: Настроить Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
