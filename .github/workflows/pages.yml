name: Сборка сайта в ветку gh-pages

# Собирает приложение и кладёт результат в ветку gh-pages,
# которую раздаёт GitHub Pages. Ничего серверного: только статика.
#
# Настройка Pages делается один раз вручную:
#   Settings -> Pages -> Source: Deploy from a branch -> gh-pages -> /(root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Публикация в ветку gh-pages
        run: |
          # .nojekyll нужен, чтобы Pages отдавал файлы как есть.
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git add -A
          git commit -q -m "Сборка из ${GITHUB_SHA}"
          git push -f origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
