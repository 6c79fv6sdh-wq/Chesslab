name: Предпросмотр ветки разработки в Pages

# Собирает НЕ main, а ветку разработки и публикует её на GitHub Pages,
# чтобы страницу можно было открыть на настоящем устройстве.
#
# Почему запуск с main. Окружение github-pages по умолчанию разрешает
# деплой только с ветки по умолчанию — запуск с claude/** отбивается с
# «Branch is not allowed to deploy to github-pages due to environment
# protection rules». Поэтому workflow живёт на main, а код берёт из
# ветки разработки: в сам main исходники не попадают.
#
# Триггер push нужен потому, что ручной запуск через API недоступен
# (403 на ручке dispatches), а первый запуск чем-то начать надо.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка, которую публикуем'
        required: false
        default: 'claude/sciencechess-hyperlab-n3ng4f'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Ветка подставляется здесь же, без промежуточной переменной:
      # обращение к env внутри with роняло разбор всего файла.
      # При push github.event.inputs пуст — берётся значение по умолчанию.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'claude/sciencechess-hyperlab-n3ng4f' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      # Второй путь той же сборки — /2/ — специально для случая, когда у
      # кого-то на устройстве старый service worker намертво прилип к
      # корневому адресу и не даёт увидеть новую версию (offline-first,
      # см. core/update.ts): scope service worker'а — путь, а не origin,
      # поэтому у /2/ он свой, ещё ни разу не зарегистрированный, и там
      # гарантированно открывается сразу актуальная сборка. base: './' в
      # vite.config.ts делает все пути в dist/ относительными — тот же
      # билд уже проверен под вложенным путём (см. docs/lab-integration-brief.md
      # про /lab/ на основном сайте), поэтому простое копирование, а не
      # отдельная пересборка.
      - name: Тот же билд ещё и под /2/ (обход прилипшего service worker)
        run: |
          mkdir -p site
          cp -r dist/. site/
          mkdir -p site/2
          cp -r dist/. site/2/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
