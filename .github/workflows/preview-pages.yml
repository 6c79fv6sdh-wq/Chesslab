name: Предпросмотр ветки разработки в Pages

# Собирает НЕ main, а ветку разработки и публикует её на GitHub Pages,
# чтобы страницу можно было открыть на настоящем устройстве.
#
# Почему запуск с main. Окружение github-pages по умолчанию разрешает
# деплой только с ветки по умолчанию — запуск с claude/** отбивается с
# «Branch is not allowed to deploy to github-pages due to environment
# protection rules». Поэтому workflow живёт на main, а код берёт из
# ветки ниже: в сам main исходники не попадают.
#
# Триггер push нужен потому, что ручной запуск через API недоступен
# (403 на ручке dispatches), а первый запуск чем-то начать надо.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка, которую публикуем'
        required: false
        default: 'claude/sciencechess-hyperlab-n3ng4f'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

env:
  # Именно github.event.inputs, а не inputs: контекст inputs существует
  # только у workflow_dispatch и workflow_call, и при push обращение к
  # нему роняет разбор всего файла. Здесь путь есть всегда, при push он
  # просто пуст — и берётся значение по умолчанию.
  PREVIEW_REF: ${{ github.event.inputs.ref || 'claude/sciencechess-hyperlab-n3ng4f' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Адрес предпросмотра
        run: echo "### Предпросмотр: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
